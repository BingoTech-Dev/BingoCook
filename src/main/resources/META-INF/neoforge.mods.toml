[[mods]]
modId="bingocook"
version="${file.jarVersion}"
displayName="Bingo Cook"
credits="BingoTech"
authors="bingo"
description='''
BingoCook enhances Minecraft's cooking and food system with an element-driven cooking pot:
- 3x3 ingredient grid with a furnace-style progress arrow, heated by a lit campfire below
- Elemental values (fruit/vegetable/meat/egg/milk/honey/chaos/seasoning) on food items, fully data-driven
- Custom datapack recipes with elemental requirements and seasoning modifiers (nutrition, effects, permanent attributes)
- Query commands: /bingocook elements list|item|recipe
'''
