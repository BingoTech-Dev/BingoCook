name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            FULL_VERSION="CI.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
            echo "full_version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "full_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version="${{ steps.version.outputs.full_version }}"

      - name: Upload mod artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/bingocook-*.jar
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-jar

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.build.outputs.release_tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists, skipping creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: BingoCook ${{ needs.build.outputs.full_version }}
          body: |
            Automated CI build for commit ${{ github.sha }}.

            **Version:** ${{ needs.build.outputs.full_version }}
            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
          files: bingocook-*.jar
          make_latest: true
          generate_release_notes: true

      - name: Delete previous CI releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          CURRENT_TAG="${{ needs.build.outputs.release_tag }}"
          mapfile -t tags < <(gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName')
          for tag in "${tags[@]}"; do
            if [[ "$tag" == CI.* && "$tag" != "$CURRENT_TAG" ]]; then
              echo "Deleting previous CI release: ${tag}"
              gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
            fi
          done
